<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" role="img" aria-labelledby="t d"><title id="t">System architecture</title><desc id="d">Two paths: a Simulink model path ending in Embedded Coder (not completed) and the Crazyflie, and a hand-written FreeRTOS path with dynamic model, filter, controller, reference and log tasks sharing state through semaphores.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="900" height="385" rx="10" fill="#f6f8fa"/><text x="20" y="28" font-size="13" text-anchor="start" fill="#24292f" font-weight="700" font-family="sans-serif">Model-based path (MATLAB / Simulink)</text><rect x="20" y="44" width="150" height="56" rx="6" fill="#cfe3f4" stroke="#57606a" /><text x="95.0" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Simscape plant</text><text x="95.0" y="79" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">nonlinear, 5 outputs</text><line x1="170" y1="72" x2="200" y2="72" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><rect x="200" y="44" width="150" height="56" rx="6" fill="#cfe3f4" stroke="#57606a" /><text x="275.0" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Linearise at hover</text><text x="275.0" y="79" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">5 states, 4 inputs</text><line x1="350" y1="72" x2="380" y2="72" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><rect x="380" y="44" width="150" height="56" rx="6" fill="#cfe3f4" stroke="#57606a" /><text x="455.0" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Discretise + dlqr</text><text x="455.0" y="79" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">Ts = 0.01 s, Q, R</text><line x1="530" y1="72" x2="560" y2="72" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><rect x="560" y="44" width="160" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 4"/><text x="640.0" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Embedded Coder</text><text x="640.0" y="79" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">not completed</text><line x1="720" y1="72" x2="750" y2="72" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="750" y="44" width="130" height="56" rx="6" fill="#cdeadf" stroke="#57606a" /><text x="815.0" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Crazyflie 2.1</text><text x="815.0" y="79" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">BMI088 IMU</text><text x="20" y="150" font-size="13" text-anchor="start" fill="#24292f" font-weight="700" font-family="sans-serif">Hand-written C path (FreeRTOS, desktop run)</text><rect x="20" y="166" width="150" height="66" rx="6" fill="#f6e3b8" stroke="#57606a" /><text x="95.0" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">dynamic model task</text><text x="95.0" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">1 ms, course template</text><rect x="200" y="166" width="150" height="66" rx="6" fill="#f6e3b8" stroke="#57606a" /><text x="275.0" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">filter task (ours)</text><text x="275.0" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">5 ms, complementary</text><rect x="380" y="166" width="150" height="66" rx="6" fill="#f6e3b8" stroke="#57606a" /><text x="455.0" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">control task</text><text x="455.0" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">10 ms (100 Hz), LQ gain K</text><rect x="560" y="166" width="160" height="66" rx="6" fill="#f6e3b8" stroke="#57606a" /><text x="640.0" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">reference task</text><text x="640.0" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">roll/pitch triangles</text><rect x="750" y="166" width="130" height="66" rx="6" fill="#f6e3b8" stroke="#57606a" /><text x="815.0" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">log task</text><text x="815.0" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">simulation.csv</text><line x1="170" y1="199" x2="200" y2="199" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><line x1="350" y1="199" x2="380" y2="199" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><line x1="560" y1="199" x2="530" y2="199" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><text x="185" y="262" font-size="11" text-anchor="middle" fill="#24292f" font-weight="400" font-family="sans-serif">sensors_sem</text><text x="365" y="262" font-size="11" text-anchor="middle" fill="#24292f" font-weight="400" font-family="sans-serif">estimate_sem</text><text x="545" y="262" font-size="11" text-anchor="middle" fill="#24292f" font-weight="400" font-family="sans-serif">references_sem</text><path d="M455 232 V292 H95 V232" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="275" y="310" font-size="11" text-anchor="middle" fill="#24292f" font-weight="400" font-family="sans-serif">motors_sem: PWM commands back to the dynamic model</text><line x1="455" y1="100" x2="455" y2="166" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="463" y="135" font-size="11" text-anchor="start" fill="#24292f" font-weight="400" font-family="sans-serif">gain K typed into C</text><text x="20" y="350" font-size="11" text-anchor="start" fill="#24292f" font-weight="400" font-family="sans-serif">Shared state (sensors, estimate, references, motors) is copied under a binary semaphore in each task.</text><text x="20" y="368" font-size="11" text-anchor="start" fill="#24292f" font-weight="400" font-family="sans-serif">Blue: model-based tooling. Yellow: C tasks. Green: hardware. Dashed: step not completed, or done by hand.</text></svg>