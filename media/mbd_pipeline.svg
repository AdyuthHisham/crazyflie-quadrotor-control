<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" width="900" role="img" aria-labelledby="t d"><title id="t">Model-based development pipeline</title><desc id="d">Requirement, model, simulate, test, code generation and deploy, with code generation not completed and testing done manually.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="900" height="175" rx="10" fill="#f6f8fa"/><rect x="15" y="30" width="128" height="66" rx="6" fill="#cfe3f4" stroke="#57606a" /><text x="79.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Requirement</text><text x="79.0" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">hold roll/pitch,</text><text x="79.0" y="80" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">track pulses</text><line x1="143" y1="63" x2="163" y2="63" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><rect x="163" y="30" width="128" height="66" rx="6" fill="#cfe3f4" stroke="#57606a" /><text x="227.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Model</text><text x="227.0" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">Simscape plant,</text><text x="227.0" y="80" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">linearised state space</text><line x1="291" y1="63" x2="311" y2="63" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><rect x="311" y="30" width="128" height="66" rx="6" fill="#cfe3f4" stroke="#57606a" /><text x="375.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Simulate</text><text x="375.0" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">pulse + disturbance,</text><text x="375.0" y="80" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">tune Q and R by hand</text><line x1="439" y1="63" x2="459" y2="63" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" /><rect x="459" y="30" width="128" height="66" rx="6" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 4"/><text x="523.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Test</text><text x="523.0" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">manual scenarios;</text><text x="523.0" y="80" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">no Breach/STL script</text><line x1="587" y1="63" x2="607" y2="63" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="607" y="30" width="128" height="66" rx="6" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 4"/><text x="671.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Code generation</text><text x="671.0" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">Embedded Coder</text><text x="671.0" y="80" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">not completed</text><line x1="735" y1="63" x2="755" y2="63" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="755" y="30" width="128" height="66" rx="6" fill="#cdeadf" stroke="#57606a" /><text x="819.0" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">Deploy</text><text x="819.0" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">flashed controller</text><text x="819.0" y="80" text-anchor="middle" font-size="12" font-weight="400" fill="#24292f">oscillated in roll</text><path d="M819 96 V130 H79 V96" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="450" y="126" font-size="11" text-anchor="middle" fill="#24292f" font-weight="400" font-family="sans-serif">next: feed hardware mismatch back into the model (motor/thrust, delay, filter)</text><text